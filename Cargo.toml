[package]
name = "post-action-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "投稿のアクションバーに足す手動ボタン(後で読む / 本文をコピー / 引用の下書き)。タグで既存ボタンのバンドルに入る"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rasq-plugin-kit = { path = "kit" }
serde_json = "1"

[workspace]
members = ["kit"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
